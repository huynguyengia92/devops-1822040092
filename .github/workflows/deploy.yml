name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Job 1: kiểm tra code
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy code về
        uses: actions/checkout@v4

      - name: Kiểm tra đủ 3 file
        run: |
          for f in index.html style.css script.js; do
            if [ ! -f "$f" ]; then
              echo "::error::Thiếu file $f"
              exit 1
            fi
            echo "OK: có file $f"
          done

      - name: Kiểm tra index.html có thẻ title
        run: |
          if ! grep -qi "<title>" index.html; then
            echo "::error::index.html thiếu thẻ <title>"
            exit 1
          fi
          echo "OK: có thẻ <title>"

  # Job 2: deploy, chỉ chạy khi check thành công
  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Lấy code về
        uses: actions/checkout@v4

      - name: Gom file website
        run: |
          mkdir _site
          cp index.html style.css script.js _site/

      - name: Cấu hình Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
